<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SocialSpot - Login</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
</head>
<body>
    <div class="form-container">
        <div class="progress-indicator">
            <div class="active-indicator"></div>
            <div class="inactive-indicator"></div>
        </div>
        
        <div class="header-text">
            <h2>Inicio de sesión</h2>
            <a href="register.html" class="front-arrow">›</a>
        </div>
        
        <div class="logo-container">
            <img src="../assets/images/Social_LogoV1.png" alt="SocialSpot Logo" class="logo">
            <h1>SocialSpot</h1>
        </div>
        
        <form class="form" id="login-form">
            <input type="email" class="input" placeholder="Correo Electronico" id="login-email" required>
            <input type="password" class="input" placeholder="Contraseña" id="login-password" required>
            
            <button type="submit" class="action-button">Iniciar sesión</button>
        </form>
        
        <div class="forgot-password-link">
            <a href="forgot-password.html">¿Olvidaste tu contraseña?</a>
        </div>
        
        <div class="register-link">
            <a href="register.html">Registrarse</a>
        </div>
        
        <div class="social-login">
            <a href="#" class="social-icon google-icon"><img src="../assets/images/google-icon.png" alt="Google"></a>
            <a href="#" class="social-icon facebook-icon"><img src="../assets/images/facebook-icon.webp" alt="Facebook"></a>
            <a href="#" class="social-icon twitter-icon"><img src="../assets/images/twitter-icon.webp" alt="Twitter"></a>
        </div>
    </div>

    <script src="../JS/auth/login.js" type="module"></script>
    <script src="../js/dark-mode.js" type="module"></script>
</body>
</html>
