<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - SocialSpot</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="form-container">
        <div class="logo-container">
            <img src="../assets/images/Social_LogoV1.png" alt="SocialSpot Logo" class="logo">
            <h1>Restablecer Contraseña</h1>
        </div>
        
        <form class="form" id="reset-password-form">
            <input type="hidden" id="reset-token">
            <input type="password" class="input" placeholder="Nueva contraseña" id="new-password" required>
            <input type="password" class="input" placeholder="Confirmar nueva contraseña" id="confirm-password" required>
            
            <button type="submit" class="action-button">Restablecer Contraseña</button>
        </form>
    </div>

    <script src="../JS/auth/reset-password.js" type="module"></script>
</body>
</html>
