<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SocialSpot - Recuperar Contraseña</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
</head>
<body>
    <div class="form-container">
        
        <div class="header-text">
            <a href="login.html" class="back-arrow">‹</a>
            <h2>Recuperar contraseña</h2>
        </div>
        
        <div class="logo-container">
            <img src="../assets/images/Social_LogoV1.png" alt="SocialSpot Logo" class="logo">
            <h1>SocialSpot</h1>
        </div>
        
        <form class="form" id="forgot-password-form">
            <p class="instructions">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
            <input type="email" class="input" placeholder="Correo Electronico" id="forgot-email" required>
            
            <button type="submit" class="action-button">Enviar enlace</button>
        </form>
        
        <div class="login-link">
            <p>¿Recordaste tu contraseña? <a href="login.html">Inicia sesión</a></p>
        </div>
    </div>

    <script src="../JS/auth/forgot-password.js" type="module"></script>
    <script src="../js/dark-mode.js" type="module"></script>
</body>
</html>
