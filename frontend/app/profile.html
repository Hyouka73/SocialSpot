<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil de Usuario</title>
  <link rel="stylesheet" href="../CSS/profile.css" />
  <link rel="stylesheet" href="../css/dark-mode.css">
</head>
<body>
  <div class="profile-container">
    <header>
      <button class="back-btn">←</button>
      <h1 id="username">Usuario#000</h1>
      <button class="settings-btn">⚙️</button>
    </header>

    <section class="user-info">
      <img id="profile-img" src='../assets/perfiles/carlos.jpg' alt="Perfil">
      <p id="description">Cargando descripción...</p>
      <p id="user-level" class="level">🌟 Nivel</p>
    </section>

    <section class="section">
      <h2>Medallas Obtenidas</h2>
      <div id="medals" class="card-scroll"></div>
    </section>

    <section class="section">
      <h2>Lugares visitados</h2>
      <div id="places" class="card-scroll"></div>
    </section>

    <section class="section">
      <h2>Amigos</h2>
      <div id="friends" class="avatar-scroll"></div>
    </section>

    <nav class="bottom-nav">
      <button class="nav-btn active">🏠</button>
      <!-- Quitamos botón de perfil aquí -->
    </nav>
  </div>

  <script src="../JS/profile.js"></script>
  <script src="../js/dark-mode.js"></script>
</body>
</html>
